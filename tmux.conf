# set prefix to metaky + d
set-option -g prefix C-Space

# okay... so the mouse alright for scrolling
set -g mouse on

# performance stuff
set -g default-terminal "tmux-256color"
# 24-bit / truecolor passthrough (Alacritty on niri, xterm-256color elsewhere)
set -ga terminal-overrides ",alacritty:RGB,xterm-256color:RGB"

# copy-paste integration (if on macOS, run 'brew install reattach-to-user-namespace'
if-shell "uname | grep -q Darwin" "set-option -g default-command 'reattach-to-user-namespace -l zsh'"

# use vim keybindings in copy mode
set-window-option -g mode-keys vi

# 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# System-clipboard integration is handled by tmux-yank (plugin list below),
# which auto-selects wl-copy on Wayland (niri) and xclip/xsel on X11 (i3).
# Run `prefix + I` once on a fresh machine to install plugins.
set -g @yank_selection_mouse 'clipboard'
set -g set-clipboard on

# split panes using h and v
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file with prefix + r
bind r source-file ~/.tmux.conf

# switch between panes using vi-like commands an no prefix
# bind -n C-h select-pane -L
# bind -n C-l select-pane -R
# bind -n C-k select-pane -U
# bind -n C-j select-pane -D

# swap panes
bind k swap-pane -U
bind j swap-pane -D

# clear terminal output
bind -n C-n send-keys -R Enter

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# Format tmux line after airline (if it exists)
source-file ~/dotfiles/tmuxline_snapshot
# if-shell "test -f ~/dotfiles/tmuxline_snapshot" "source ~/dotfiles/tmuxline_snapshot""

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

# Initialize TMUX plugin manager (keep this line at the very bottom of .tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
